<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e65100">
  <title>카운터 알림</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 처음 열 때 로그인 상태 확인하는 동안 -->
  <div id="loading" class="screen center">불러오는 중…</div>

  <!-- 로그인 화면 -->
  <main id="login" class="screen hidden">
    <form id="loginForm" class="card" autocomplete="on">
      <h1>카운터 알림</h1>
      <p class="sub">관리자 로그인</p>

      <label for="loginId">아이디</label>
      <input id="loginId" name="username" autocomplete="username"
             placeholder="사장님 또는 매니저" required>

      <label for="loginPw">비밀번호</label>
      <input id="loginPw" name="password" type="password"
             autocomplete="current-password" required>

      <label class="check">
        <input id="autoLogin" type="checkbox" checked>
        자동 로그인
      </label>

      <p id="loginError" class="error" role="alert"></p>
      <button id="loginBtn" type="submit">로그인</button>
    </form>
  </main>

  <!-- 로그인 후 화면 (6단계에서 메시지 보내기가 들어감) -->
  <main id="home" class="screen hidden">
    <header class="topbar">
      <span id="whoami"></span>
      <button id="logoutBtn" class="ghost" type="button">로그아웃</button>
    </header>
    <section class="card">
      <h2>로그인 완료</h2>
      <p class="sub">메시지 보내기 화면은 다음 단계에서 이 자리에 들어갑니다.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
